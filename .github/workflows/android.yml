name: Android

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do núcleo
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Gerar o APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Nomear os APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/NotasWorkflow-android-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/NotasWorkflow-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NotasWorkflow-android
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: app/build/reports/tests/

      - name: Publicar a versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/NotasWorkflow-android.apk
