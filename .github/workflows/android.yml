name: Android

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do núcleo
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Gerar o APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Nomear os APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/NotasWorkflow-android-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/NotasWorkflow-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NotasWorkflow-android
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: app/build/reports/tests/

      - name: Ver se a versão já foi publicada
        id: version
        if: github.event_name == 'push'
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Uma tag v* enviada publica a versão; uma versão nova (versionName) que chega ao main também,
      # criando a tag v<versão> no commit enviado.
      - name: Publicar a versão
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.version.outputs.new == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NotasWorkflow Android ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          files: out/NotasWorkflow-android.apk
